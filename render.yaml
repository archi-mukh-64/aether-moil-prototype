# ==============================================================================
# Render Blueprint Specification for AETHER FastAPI Backend
# ==============================================================================

services:
  - type: web
    name: moil-aether-backend
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: API_PREFIX
        value: /api
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
